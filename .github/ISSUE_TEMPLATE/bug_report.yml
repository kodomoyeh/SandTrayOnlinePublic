name: Problem Report
description: Report a problem on SandTrayOnline
title: "[Problem Report] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include passwords, verification codes, personal information, or other sensitive data.

  - type: input
    id: page_url
    attributes:
      label: Page URL
      description: Provide the full URL where the problem occurred.
      placeholder: https://example.com/page
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Describe the problem you encountered.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What actually happened? Include any error messages.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant browser, device, or operating system details.
      placeholder: For example, Chrome version or Windows 11
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information or Screenshots
      description: Share any other information that may help us understand or reproduce the problem.
    validations:
      required: false
